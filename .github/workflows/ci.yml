# ==============================================================================
# Aesthetic Physique Builder - Continuous Integration & Quality Gate Pipeline
# Automated testing, pre-flight asset audits, and container build validation
# ==============================================================================

name: Aesthetic Physique CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Platform Integration & Asset Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12 LTS
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Headless System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            curl \
            libasound2 || sudo apt-get install -y --no-install-recommends libasound2t64

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r frontend_app/requirements.txt

      - name: Execute Pre-Flight Asset Audit (52 Workouts & SFX Sound Pool)
        run: |
          python package_android_bundle.py --check-assets

      - name: Run Master Ecosystem Automated Test Suite (10 Core Checkpoints)
        run: |
          python run_ecosystem.py --test

      - name: Run Cloud Connectivity & Fallback Diagnostics
        run: |
          python backend_cloud/verify_cloud_connection.py

  docker-build-verification:
    name: Container Image Build Verification
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Web Portals Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aesthetic-physique-portals:latest
