# ==============================================================================
# Aesthetic Physique Builder - Automated Cloud APK Build & GitHub Pages Deploy
# 1. Compiles Native Android Release APK using Official Flet Build Action
# 2. Publishes & Deploys the Web Portal to GitHub Pages
# ==============================================================================

name: Build Android APK & Deploy Web Portal

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "build-and-deploy"
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Build Native Android APK in Cloud Runner
  # ----------------------------------------------------------------------------
  build-android-apk:
    name: Build Production Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Build Android APK via Flet Action
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          working-directory: frontend_app
          build-version: "1.2.0"
          build-number: ${{ github.run_number }}
          archive-output: false

      - name: Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AestheticPhysique-v1.2.0-APK
          path: ${{ steps.build.outputs.archive-path }}
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.2.0
          name: "Aesthetic Physique v1.2.0 Release"
          body: |
            ## Aesthetic Physique Builder — Mobile Release v1.2.0
            - 52 Catalogued Unilateral Exercise Routines (DAY-A through DAY-G)
            - Non-Drift Wall-Clock Rest Engine with Audio Ducking
            - Offline-First SQLite WAL Mode & Recovery Ledgers
            - Official Classical Greek Statue Bust App Icon
          files: ${{ steps.build.outputs.archive-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # Job 2: Publish & Deploy Web Portals to GitHub Pages
  # ----------------------------------------------------------------------------
  deploy-github-pages:
    name: Deploy Web Portal to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1 httpx

      - name: Publish Web Portal as Static WASM Bundle
        run: |
          flet publish web_portal/main_web.py \
            --assets assets \
            --distpath dist \
            --app-name "Aesthetic Physique Portals" \
            --route-url-strategy hash

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
