# ==============================================================================
# Aesthetic Physique Builder - Automated Cloud APK Build & GitHub Pages Deploy
# 1. Compiles Native Android Release APK using Flutter + Flet CLI in Cloud Runner
# 2. Publishes & Deploys Web Portal to GitHub Pages (gh-pages branch)
# ==============================================================================

name: Build Android APK & Deploy Web Portal

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "build-and-deploy"
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Build Production Android APK
  # ----------------------------------------------------------------------------
  build-android-apk:
    name: Build Production Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Accept Android SDK Licenses & Verify Toolchain
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Install Python & Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1 httpx

      - name: Build Standalone Android APK
        run: |
          flet build apk frontend_app \
            --project aesthetic_physique \
            --product "Aesthetic Physique" \
            --org com.aestheticphysique \
            --build-version "1.2.0" \
            --build-number ${{ github.run_number }} \
            --android-adaptive-icon-background "#0D1117" \
            --no-rich-output \
            -o build_output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AestheticPhysique-v1.2.0-APK
          path: build_output/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.2.0
          name: "Aesthetic Physique v1.2.0 Release"
          body: |
            ## Aesthetic Physique Builder — Mobile Release v1.2.0
            - 52 Catalogued Unilateral Exercise Routines (DAY-A through DAY-G)
            - Non-Drift Wall-Clock Rest Engine with Audio Ducking
            - Offline-First SQLite WAL Mode & Recovery Ledgers
            - Official Classical Greek Statue Bust App Icon
          files: build_output/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ----------------------------------------------------------------------------
  # Job 2: Publish & Deploy Web Portals to GitHub Pages
  # ----------------------------------------------------------------------------
  deploy-github-pages:
    name: Deploy Web Portal to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1 httpx

      - name: Publish Web Portal as Static WASM Bundle
        run: |
          flet publish web_portal/main_web.py \
            --assets assets \
            --distpath dist \
            --app-name "Aesthetic Physique Portals" \
            --route-url-strategy hash

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
